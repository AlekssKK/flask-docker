# .github/workflows/ci-cd.yml

name: CI/CD Pipeline

# Триггер: запускать пайплайн при каждом пуш-коммите в ветку main
on:
  push:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 2: Устанавливаем Python 
      - name: Setup Python and Run Tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

       
          

      # Шаг 3: Авторизуемся в Docker Hub
      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Шаг 4: Собираем и публикуем Docker-образ
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:${{ github.sha }}